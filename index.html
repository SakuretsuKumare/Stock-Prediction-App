<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Predictor</title>
    <style>
        body { font-family: sans-serif; background-color: #222; color: white; text-align: center; padding: 40px; }
        .box { max-width: 500px; margin: 0 auto; background: #333; padding: 30px; border-radius: 10px; }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; width: 80%; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px; font-size: 16px; cursor: pointer; background: #444; color: white; border: none; border-radius: 5px; }
        button:hover { background: #007bff; }
        .result { display: none; margin-top: 20px; padding: 20px; border-radius: 5px; }
        .green { background: #28a745; }
        .red { background: #dc3545; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Market Predictor</h2>
        
        <label>Choose Asset:</label><br>
        <select id="symbol">
            <option value="EURUSD=X">EUR/USD</option>
            <option value="GBPUSD=X">GBP/USD</option>
            <option value="JPY=X">USD/JPY</option>
            <option value="BTC-USD">Bitcoin</option>
            <option value="GC=F">Gold</option>
        </select>

        <p>Choose Timeframe to Analyze:</p>
        <div class="grid">
            <!-- Passed specific intervals to the function -->
            <button onclick="getPrediction('1m')">30 Seconds (uses 1m)</button>
            <button onclick="getPrediction('1m')">1 Minute</button>
            <button onclick="getPrediction('3m')">3 Minutes</button>
            <button onclick="getPrediction('5m')">5 Minutes</button>
        </div>

        <div id="loading" style="display:none;">Analyzing...</div>

        <div id="result" class="result">
            <h1 id="direction"></h1>
            <h3 id="price"></h3>
            <p>UP Chance: <span id="prob-up"></span></p>
            <p>DOWN Chance: <span id="prob-down"></span></p>
        </div>
    </div>

    <script>
        // Accept 'interval' as a parameter
        async function getPrediction(interval) {
            const symbol = document.getElementById('symbol').value;
            const resBox = document.getElementById('result');
            const loader = document.getElementById('loading');
            
            resBox.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Fetch from Python backend, now sending BOTH symbol and interval
                const response = await fetch(`http://127.0.0.1:5000/predict?symbol=${symbol}&interval=${interval}`);
                const data = await response.json();

                loader.style.display = 'none';
                resBox.style.display = 'block';

                document.getElementById('price').innerText = "Price: " + data.current_price;
                document.getElementById('direction').innerText = data.prediction + " (" + data.interval + ")";
                document.getElementById('prob-up').innerText = data.up_probability;
                document.getElementById('prob-down').innerText = data.down_probability;

                // Set color
                if(data.prediction.includes("UP")) {
                    resBox.className = "result green";
                } else {
                    resBox.className = "result red";
                }

            } catch (error) {
                loader.style.display = 'none';
                alert("Make sure the Python Window is still open!");
            }
        }
    </script>
</body>
</html>
